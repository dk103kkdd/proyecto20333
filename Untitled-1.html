<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto Educativo Interactivo</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body{
    margin:0;
    padding:0;
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
    overflow-x:hidden;
    transition:0.4s;
}
.light-mode{
    background:#f5f5f5;
    color:#111;
}
.module{
    display:none;
    min-height:100vh;
    padding:20px;
}
.center-screen{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}
.btn-custom{
    margin:5px;
}

/* ================= SOL MENU ================= */

#mainMenu{
    height:100vh;
    position:relative;
}

.sun-container{
    position:relative;
    width:450px;
    height:450px;
}

.sun{
    width:220px;
    height:220px;
    background:radial-gradient(circle,#ffe600,#6ecb00);
    border-radius:50%;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 40px yellow;
}

.face{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

.eye{
    width:20px;
    height:20px;
    background:black;
    border-radius:50%;
    position:absolute;
}

.eye.left{left:-40px;}
.eye.right{right:-40px;}

.smile{
    width:80px;
    height:40px;
    border-bottom:6px solid black;
    border-radius:0 0 80px 80px;
    margin-top:40px;
}

.ray{
    position:absolute;
    width:180px;
    height:40px;
    background:#ffc107;
    border-radius:20px;
    text-align:center;
    line-height:40px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}
.ray:hover{
    transform:scale(1.1);
    background:#ff9800;
}

.r1{top:-20px; left:135px;}
.r2{top:70px; right:-70px; transform:rotate(45deg);}
.r3{bottom:70px; right:-70px; transform:rotate(-45deg);}
.r4{bottom:-20px; left:135px;}
.r5{top:70px; left:-70px; transform:rotate(-45deg);}

/* ================= WORD SEARCH ================= */

#wordGrid{
    display:grid;
    grid-template-columns:repeat(12,40px);
    gap:2px;
}

.cell{
    width:40px;
    height:40px;
    background:#222;
    border:1px solid #555;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    user-select:none;
    font-weight:bold;
}

.selected{
    background:orange;
}

.found{
    background:green !important;
}

.word-list li.found-word{
    text-decoration:line-through;
    color:lime;
}

/* ================= CRUCIGRAMA ================= */

#crossword{
    display:grid;
    gap:2px;
}

.cross-cell{
    width:35px;
    height:35px;
    text-align:center;
    font-weight:bold;
    text-transform:uppercase;
}

/* ================= QUIZ ================= */

.quiz-card{
    max-width:800px;
}

/* ================= SUDOKU ================= */

#sudokuGrid{
    display:grid;
    grid-template-columns:repeat(9,50px);
}

.sudoku-cell{
    width:50px;
    height:50px;
    border:1px solid #888;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

.fixed{
    background:#ddd;
    color:black;
}

.correct{
    background:#4caf50 !important;
}

.error{
    background:#f44336 !important;
}

/* ================= SNAKES ================= */

#snakeBoard{
    display:grid;
    grid-template-columns:repeat(10,60px);
    gap:2px;
}

.square{
    width:60px;
    height:60px;
    border:1px solid #555;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#222;
    position:relative;
    font-size:12px;
}

.player{
    width:20px;
    height:20px;
    border-radius:50%;
    background:red;
    position:absolute;
    bottom:5px;
}

.ladder{
    background:#4caf50 !important;
}

.snake{
    background:#e53935 !important;
}
</style>
</head>

<body>

<!-- ================= MENU ================= -->

<div id="mainMenu" class="center-screen">

    <button class="btn btn-light position-absolute top-0 end-0 m-3"
    onclick="toggleMode()">🌙 / ☀️</button>

    <div class="sun-container">

        <div class="sun">
            <div class="face">
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="smile"></div>
            </div>
        </div>

        <div class="ray r1" onclick="showModule('wordsearchModule')">
            Sopa de Letras
        </div>

        <div class="ray r2" onclick="showModule('crosswordModule')">
            Crucigrama
        </div>

        <div class="ray r3" onclick="showModule('quizModule')">
            Cuestionario
        </div>

        <div class="ray r4" onclick="showModule('sudokuModule')">
            Sudoku
        </div>

        <div class="ray r5" onclick="showModule('snakeModule')">
            Serpientes
        </div>

    </div>
</div>

<!-- ================= SOPA DE LETRAS ================= -->

<div id="wordsearchModule" class="module center-screen">

<h2>Sopa de Letras</h2>

<div class="d-flex gap-4">

<div id="wordGrid"></div>

<div>
    <h4>Palabras</h4>
    <ul class="word-list" id="wordList"></ul>

    <h4 id="timer">60</h4>

    <button class="btn btn-success btn-custom" onclick="startWordSearch()">Iniciar</button>
    <button class="btn btn-warning btn-custom" onclick="hint()">Pista +10s</button>
    <button class="btn btn-info btn-custom" onclick="pauseTimer()">Pausa</button>
    <button class="btn btn-danger btn-custom" onclick="resetWordSearch()">Reset</button>
    <button class="btn btn-secondary btn-custom" onclick="goHome()">Inicio</button>
</div>

</div>
</div>

<!-- ================= CRUCIGRAMA ================= -->

<div id="crosswordModule" class="module center-screen">
<h2>Crucigrama</h2>

<div id="crossword"></div>

<button class="btn btn-primary mt-3" onclick="checkCrossword()">Verificar</button>
<button class="btn btn-secondary mt-3" onclick="goHome()">Inicio</button>
</div>

<!-- ================= QUIZ ================= -->

<div id="quizModule" class="module center-screen">
<div class="card quiz-card p-4 bg-dark text-white">
<h2>Historia de la Ciencia</h2>

<div id="quizContainer"></div>

<h4 class="mt-3">Aciertos: <span id="score">0</span></h4>

<button class="btn btn-secondary mt-3" onclick="goHome()">Inicio</button>
</div>
</div>

<!-- ================= SUDOKU ================= -->

<div id="sudokuModule" class="module center-screen">

<h2>Sudoku</h2>

<div id="sudokuGrid"></div>

<div class="mt-3">
<button class="btn btn-success" onclick="generateSudoku()">Nuevo Juego</button>
<button class="btn btn-primary" onclick="checkSudoku()">Verificar</button>
<button class="btn btn-secondary" onclick="goHome()">Inicio</button>
</div>

</div>

<!-- ================= SNAKES ================= -->

<div id="snakeModule" class="module center-screen">

<h2>Serpientes y Escaleras</h2>

<div id="snakeBoard"></div>

<h4 class="mt-3">Posición: <span id="playerPos">1</span></h4>

<button class="btn btn-warning mt-3" onclick="rollDice()">Lanzar Dado</button>
<button class="btn btn-secondary mt-3" onclick="goHome()">Inicio</button>

<div id="snakeMessages" class="mt-3"></div>

</div>

<script>

/* ================= GENERAL ================= */

function showModule(id){
    document.querySelectorAll('.module').forEach(m=>m.style.display='none');
    document.getElementById('mainMenu').style.display='none';
    document.getElementById(id).style.display='flex';
}

function goHome(){
    document.querySelectorAll('.module').forEach(m=>m.style.display='none');
    document.getElementById('mainMenu').style.display='flex';
}

function toggleMode(){
    document.body.classList.toggle('light-mode');
}

/* ================= SOPA DE LETRAS ================= */

const words = ["ROJO","AZUL","AMARILLO","VERDE"];
let gridSize = 12;
let timer=60;
let interval;
let paused=false;
let foundWords=[];

function createGrid(){
    const grid = document.getElementById('wordGrid');
    grid.innerHTML='';

    let matrix = Array.from({length:gridSize},()=>Array(gridSize).fill(''));

    // ROJO horizontal
    "ROJO".split('').forEach((l,i)=>matrix[1][i+1]=l);

    // AZUL horizontal
    "AZUL".split('').forEach((l,i)=>matrix[3][i+4]=l);

    // AMARILLO vertical
    "AMARILLO".split('').forEach((l,i)=>matrix[i+1][8]=l);

    // VERDE diagonal
    "VERDE".split('').forEach((l,i)=>matrix[i+5][i+2]=l);

    for(let r=0;r<gridSize;r++){
        for(let c=0;c<gridSize;c++){

            if(matrix[r][c]==''){
                matrix[r][c]=String.fromCharCode(65+Math.floor(Math.random()*26));
            }

            const cell=document.createElement('div');
            cell.className='cell';
            cell.textContent=matrix[r][c];

            cell.dataset.row=r;
            cell.dataset.col=c;

            cell.onclick=()=>selectCell(cell);

            grid.appendChild(cell);
        }
    }

    const list=document.getElementById('wordList');
    list.innerHTML='';
    words.forEach(w=>{
        const li=document.createElement('li');
        li.id='word-'+w;
        li.textContent=w;
        list.appendChild(li);
    });
}

let selected='';

function selectCell(cell){
    cell.classList.add('selected');
    selected += cell.textContent;

    words.forEach(w=>{
        if(selected.includes(w) && !foundWords.includes(w)){
            foundWords.push(w);
            document.getElementById('word-'+w).classList.add('found-word');

            Swal.fire("Encontraste",w,"success");

            if(foundWords.length===words.length){
                Swal.fire("Ganaste","Completaste la sopa","success");
                clearInterval(interval);
            }
        }
    });

    setTimeout(()=>{
        selected='';
        document.querySelectorAll('.selected').forEach(c=>c.classList.remove('selected'));
    },1000);
}

function startWordSearch(){
    clearInterval(interval);
    interval=setInterval(()=>{
        if(!paused){
            timer--;
            document.getElementById('timer').textContent=timer;

            if(timer<=0){
                clearInterval(interval);

                Swal.fire("Tiempo terminado","","error");

                resetWordSearch();
            }
        }
    },1000);
}

function pauseTimer(){
    paused=!paused;
}

function hint(){
    timer+=10;
}

function resetWordSearch(){
    timer=60;
    foundWords=[];
    document.getElementById('timer').textContent=timer;
    createGrid();
}

createGrid();

/* ================= CRUCIGRAMA ================= */

const animals=[
"GATO","PERRO","LEON","TIGRE","OSO",
"ZEBRA","MONO","RATON","CABALLO","PANDA"
];

function createCrossword(){

    const size=15;
    const board=document.getElementById('crossword');
    board.style.gridTemplateColumns=`repeat(${size},35px)`;
    board.innerHTML='';

    let grid=Array.from({length:size},()=>Array(size).fill(''));

    animals.forEach((word,index)=>{

        if(index%2===0){

            let row=index+1;
            word.split('').forEach((l,i)=>{
                grid[row][i+2]=l;
            });

        }else{

            let col=index+2;
            word.split('').forEach((l,i)=>{
                grid[i+2][col]=l;
            });
        }
    });

    for(let r=0;r<size;r++){
        for(let c=0;c<size;c++){

            const input=document.createElement('input');

            input.maxLength=1;
            input.className='cross-cell';

            if(grid[r][c]==''){
                input.disabled=true;
                input.style.background='black';
            }else{
                input.dataset.letter=grid[r][c];
            }

            board.appendChild(input);
        }
    }
}

function checkCrossword(){

    let ok=true;

    document.querySelectorAll('.cross-cell').forEach(cell=>{

        if(cell.dataset.letter){

            if(cell.value.toUpperCase()!==cell.dataset.letter){
                ok=false;
                cell.style.background='red';
            }else{
                cell.style.background='lightgreen';
            }
        }
    });

    if(ok){
        Swal.fire("Excelente","Crucigrama completado","success");
    }
}

createCrossword();

/* ================= QUIZ ================= */

const quiz=[
{
q:"¿Quién formuló la teoría de la relatividad?",
o:["Newton","Einstein","Tesla","Darwin"],
a:1
},
{
q:"¿Quién descubrió la gravedad?",
o:["Newton","Galileo","Curie","Tesla"],
a:0
},
{
q:"¿Quién descubrió la penicilina?",
o:["Pasteur","Fleming","Edison","Bohr"],
a:1
},
{
q:"¿Quién propuso el heliocentrismo?",
o:["Copérnico","Kepler","Darwin","Einstein"],
a:0
},
{
q:"¿Quién desarrolló la vacuna contra la rabia?",
o:["Pasteur","Newton","Tesla","Galileo"],
a:0
},
{
q:"¿Quién descubrió la radiactividad?",
o:["Curie","Faraday","Darwin","Bohr"],
a:0
},
{
q:"¿Quién inventó la bombilla?",
o:["Tesla","Edison","Newton","Bohr"],
a:1
},
{
q:"¿Quién descubrió América?",
o:["Colón","Newton","Darwin","Curie"],
a:0
},
{
q:"¿Quién estudió la evolución?",
o:["Darwin","Bohr","Tesla","Faraday"],
a:0
},
{
q:"¿Quién creó las leyes del movimiento?",
o:["Newton","Einstein","Curie","Tesla"],
a:0
}
];

let score=0;

function loadQuiz(){

    const container=document.getElementById('quizContainer');
    container.innerHTML='';

    quiz.forEach((item,index)=>{

        let div=document.createElement('div');
        div.className='mb-4';

        div.innerHTML=`<h5>${index+1}. ${item.q}</h5>`;

        item.o.forEach((opt,i)=>{

            let btn=document.createElement('button');

            btn.className='btn btn-outline-light d-block mt-2';

            btn.textContent=opt;

            btn.onclick=()=>{

                if(i===item.a){

                    Swal.fire("Correcto","","success");
                    score++;

                }else{

                    Swal.fire("Incorrecto","","error");
                }

                document.getElementById('score').textContent=score;

                btn.disabled=true;
            };

            div.appendChild(btn);
        });

        container.appendChild(div);
    });
}

loadQuiz();

/* ================= SUDOKU ================= */

let sudoku=[
[5,3,'', '',7,'','','',''],
[6,'','',1,9,5,'','',''],
['',9,8,'','','','',6,''],
[8,'','','',6,'','','',3],
[4,'','',8,'',3,'','',1],
[7,'','','',2,'','','',6],
['',6,'','','','',2,8,''],
['','','',4,1,9,'','',5],
['','','','',8,'','',7,9]
];

let solution=[
[5,3,4,6,7,8,9,1,2],
[6,7,2,1,9,5,3,4,8],
[1,9,8,3,4,2,5,6,7],
[8,5,9,7,6,1,4,2,3],
[4,2,6,8,5,3,7,9,1],
[7,1,3,9,2,4,8,5,6],
[9,6,1,5,3,7,2,8,4],
[2,8,7,4,1,9,6,3,5],
[3,4,5,2,8,6,1,7,9]
];

function generateSudoku(){

    const grid=document.getElementById('sudokuGrid');
    grid.innerHTML='';

    for(let r=0;r<9;r++){

        for(let c=0;c<9;c++){

            let input=document.createElement('input');

            input.className='sudoku-cell';
            input.maxLength=1;

            if(sudoku[r][c]!==''){
                input.value=sudoku[r][c];
                input.disabled=true;
                input.classList.add('fixed');
            }

            input.dataset.row=r;
            input.dataset.col=c;

            grid.appendChild(input);
        }
    }
}

function checkSudoku(){

    document.querySelectorAll('.sudoku-cell').forEach(cell=>{

        let r=cell.dataset.row;
        let c=cell.dataset.col;

        if(!cell.disabled){

            if(parseInt(cell.value)===solution[r][c]){
                cell.classList.add('correct');
            }else{
                cell.classList.add('error');
            }
        }
    });
}

generateSudoku();

/* ================= SERPIENTES ================= */

const snakes={
16:6,
48:30,
62:19,
88:24,
95:56
};

const ladders={
3:22,
11:45,
20:59,
41:79,
71:92
};

let player=1;

function createBoard(){

    const board=document.getElementById('snakeBoard');
    board.innerHTML='';

    for(let i=100;i>=1;i--){

        let square=document.createElement('div');

        square.className='square';
        square.id='sq'+i;

        square.textContent=i;

        if(snakes[i]) square.classList.add('snake');
        if(ladders[i]) square.classList.add('ladder');

        board.appendChild(square);
    }

    renderPlayer();
}

function renderPlayer(){

    document.querySelectorAll('.player').forEach(p=>p.remove());

    const token=document.createElement('div');
    token.className='player';

    document.getElementById('sq'+player).appendChild(token);

    document.getElementById('playerPos').textContent=player;
}

function rollDice(){

    let dice=Math.floor(Math.random()*6)+1;

    let newPos=player+dice;

    if(newPos<=100){
        player=newPos;
    }

    if(ladders[player]){
        document.getElementById('snakeMessages').innerHTML=
        "Subiste una escalera 🚀";
        player=ladders[player];
    }

    if(snakes[player]){
        document.getElementById('snakeMessages').innerHTML=
        "Una serpiente te bajó 🐍";
        player=snakes[player];
    }

    renderPlayer();

    if(player===100){
        Swal.fire("Ganaste","Llegaste a la casilla 100","success");
        player=1;
        renderPlayer();
    }
}

createBoard();

</script>

</body>
</html>
